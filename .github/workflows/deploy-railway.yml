name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
      RAILWAY_ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -euo pipefail
          args=(--ci)
          if [ -n "${RAILWAY_SERVICE_NAME:-}" ]; then
            args+=(--service="$RAILWAY_SERVICE_NAME")
          fi
          if [ -n "${RAILWAY_ENVIRONMENT_NAME:-}" ]; then
            args+=(--environment="$RAILWAY_ENVIRONMENT_NAME")
          fi
          railway up "${args[@]}"

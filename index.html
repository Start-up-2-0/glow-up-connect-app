<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo/logo_original.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0825" />
    <title>Glow Up Connect</title>
    <!-- Tema síncrono antes do paint — sobrevive ao build de produção -->
    <script>
      (function () {
        var THEME_KEY = 'guc_theme';
        var VERSION_KEY = 'guc_theme_version';
        var VERSION = '3';
        var DEFAULT = 'dark';
        try {
          if (localStorage.getItem(VERSION_KEY) !== VERSION) {
            localStorage.setItem(THEME_KEY, DEFAULT);
            localStorage.setItem(VERSION_KEY, VERSION);
          }
          var theme = localStorage.getItem(THEME_KEY);
          if (theme !== 'light' && theme !== 'dark') theme = DEFAULT;
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" src="/src/boot/theme.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
